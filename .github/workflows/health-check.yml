name: MaxChess hourly health check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/health-check.yml"
      - "*.html"
      - "**/*.html"
      - "*.js"
      - "**/*.js"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  website-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke-test published pages on desktop, tablet and touch
        id: smoke
        run: |
          cat > health-check.cjs <<'EOF'
          const { chromium } = require('playwright');

          const origin = 'https://themaxchessss.github.io';
          const routes = [
            '/',
            '/training-planner.html',
            '/notation-sheet-session.html',
            '/tournament-desk.html',
            '/maxchess-top-100.html',
            '/chess-clock.html',
            '/team-workspace.html',
            '/workbench.html',
            '/workspace.html',
            '/team.html',
            '/newsletter.html',
            '/support.html',
            '/privacy.html',
            '/terms.html'
          ];
          const devices = [
            { name: 'desktop', viewport: { width: 1280, height: 900 }, scale: 1 },
            { name: 'tablet', viewport: { width: 820, height: 1180 }, scale: 1 },
            { name: 'iPad-sized touch simulation', viewport: { width: 810, height: 1080 }, scale: 2, touch: true, mobile: true }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const problems = [];
            const checkedLinks = new Set();

            for (const device of devices) {
              const context = await browser.newContext({
                viewport: device.viewport,
                deviceScaleFactor: device.scale,
                isMobile: Boolean(device.mobile),
                hasTouch: Boolean(device.touch)
              });

              for (const route of routes) {
                const page = await context.newPage();
                page.on('pageerror', error => problems.push(`[${device.name} ${route}] JavaScript exception: ${error.message}`));
                page.on('console', msg => {
                  if (msg.type() === 'error') problems.push(`[${device.name} ${route}] Console error: ${msg.text()}`);
                });
                page.on('requestfailed', request => {
                  if (request.url().startsWith(origin + '/')) {
                    problems.push(`[${device.name} ${route}] Failed first-party request: ${request.url()} (${request.failure()?.errorText})`);
                  }
                });

                try {
                  const response = await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  if (!response || response.status() !== 200) {
                    problems.push(`[${device.name} ${route}] Expected HTTP 200, received ${response?.status() ?? 'no response'}`);
                  }

                  await page.waitForTimeout(700);
                  const pageState = await page.evaluate(() => ({
                    title: document.title.trim(),
                    textLength: (document.body?.innerText || '').trim().length,
                    bodyVisible: Boolean(document.body && document.body.getBoundingClientRect().height > 0),
                    viewportWidth: document.documentElement.clientWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    brokenImages: [...document.images]
                      .filter(img => img.complete && img.naturalWidth === 0 && img.currentSrc)
                      .map(img => img.currentSrc),
                    links: [...document.querySelectorAll('a[href]')].map(a => ({
                      href: a.href,
                      text: (a.innerText || a.getAttribute('aria-label') || '').trim()
                    }))
                  }));

                  if (!pageState.title) problems.push(`[${device.name} ${route}] Page has no document title`);
                  if (pageState.textLength < 40) problems.push(`[${device.name} ${route}] Page appears blank or has too little visible text (${pageState.textLength} characters)`);
                  if (!pageState.bodyVisible) problems.push(`[${device.name} ${route}] Document body is not visible`);
                  if (device.touch && pageState.documentWidth > pageState.viewportWidth + 4) {
                    problems.push(`[${device.name} ${route}] Horizontal overflow: document is ${pageState.documentWidth}px wide in a ${pageState.viewportWidth}px viewport`);
                  }
                  for (const imageUrl of pageState.brokenImages) {
                    problems.push(`[${device.name} ${route}] Broken image: ${imageUrl}`);
                  }

                  for (const link of pageState.links) {
                    if (!link.href.startsWith(origin + '/')) continue;
                    const url = new URL(link.href);
                    const fragment = decodeURIComponent(url.hash.slice(1));
                    url.hash = '';
                    const target = url.href;
                    if (!checkedLinks.has(target)) checkedLinks.add(target);
                    if (fragment && new URL(target).pathname === new URL(origin + route).pathname) {
                      const exists = await page.evaluate(id =>
                        Boolean(document.getElementById(id) || [...document.getElementsByName(id)].length),
                        fragment
                      );
                      if (!exists) problems.push(`[${device.name} ${route}] Missing in-page link target #${fragment}`);
                    }
                  }
                } catch (error) {
                  problems.push(`[${device.name} ${route}] Page test failed: ${error.message}`);
                } finally {
                  await page.close();
                }
              }
              await context.close();
            }

            const requestContext = await browser.newContext();
            for (const url of checkedLinks) {
              try {
                const response = await requestContext.request.get(url, { timeout: 20000 });
                if (response.status() >= 400) problems.push(`Broken internal link (${response.status()}): ${url}`);
              } catch (error) {
                problems.push(`Could not verify internal link ${url}: ${error.message}`);
              }
            }
            await requestContext.close();
            await browser.close();

            if (problems.length) {
              console.error('MAXCHESS HEALTH CHECK FAILED');
              for (const problem of [...new Set(problems)]) console.error('- ' + problem);
              process.exit(1);
            }
            console.log(`Passed: ${routes.length} published pages across ${devices.length} viewport profiles; checked ${checkedLinks.size} unique internal links, page errors, loaded images and touch-width overflow.`);
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node health-check.cjs

      - name: Open or update a problem report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automated health check] MaxChess may have a problem';
            const { owner, repo } = context.repo;
            const runs = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = runs.data.find(issue => issue.title === title);
            const body = 'The hourly MaxChess website smoke test failed. Check the failed workflow run for details: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [] });
            }

      - name: Close problem report after a successful check
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automated health check] MaxChess may have a problem';
            const { owner, repo } = context.repo;
            const runs = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = runs.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: 'The latest hourly health check passed. Automatically closing this report.' });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
