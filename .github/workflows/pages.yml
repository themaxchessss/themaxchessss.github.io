name: Deploy Max Chess to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC; run at 04:00 and 05:00 UTC, then deploy only at New York midnight (DST-safe).
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether it is midnight in New York
        id: localtime
        run: echo "is_midnight=$( [ "$(TZ=America/New_York date +%H)" = "00" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        if: steps.localtime.outputs.is_midnight == 'true' || github.event_name != 'schedule'
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        if: steps.localtime.outputs.is_midnight == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - name: Upload website files
        if: steps.localtime.outputs.is_midnight == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        if: steps.localtime.outputs.is_midnight == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
