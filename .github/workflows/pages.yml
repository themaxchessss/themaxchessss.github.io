name: Deploy Max Chess to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Smoke-check MaxChess Live broadcast page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('tournament-broadcast.html', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const refs = [...html.matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !ids.includes(id)))];
          if (missing.length) throw new Error('Missing broadcast DOM IDs: ' + missing.join(', '));
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1]).filter(s => s.trim());
          if (!scripts.length) throw new Error('No inline broadcast script found');
          scripts.forEach(script => new vm.Script(script));
          for (const required of [
            'DGT LiveChess Cloud', 'round-',
            'function startBoardCycle()', 'mode','obs','livechesscloud.com',
            'dgtViewer', 'cycleSeconds', 'function parseTournamentId'
          ]) {
            if (!html.includes(required)) throw new Error('Missing required broadcast feature: ' + required);
          }
          if (!html.includes("u.protocol!=='https:'")) throw new Error('DGT URL validation must require HTTPS');
          console.log('MaxChess Live smoke check passed: script syntax, DOM IDs, DGT feed, OBS mode and board rotation.');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        run: sleep 10
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
