<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaxChess Double-Sided Business Card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee}
.card-page{width:3.78in;height:2in;margin:24px auto;background:#fff;break-after:page;page-break-after:always;overflow:hidden}
.card-page:last-child{break-after:auto;page-break-after:auto}
.card-page img{display:block;width:100%;height:100%;object-fit:fill}
@page{size:3.78in 2in;margin:0}
@media print{html,body{background:#fff}.card-page{margin:0;box-shadow:none}}
@media screen{.card-page{box-shadow:0 2px 14px #0002}.hint{max-width:640px;margin:18px auto;font:14px/1.5 system-ui;color:#222;text-align:center}}
</style>
</head>
<body>
<p class="hint">Print double-sided at 100% scale. Front is page 1; back with the standard black-and-white QR code is page 2. Choose duplex printing and flip on the long edge.</p>
<section class="card-page" aria-label="Front of MaxChess business card"><img src="maxchess-card-front.png" alt="MaxChess business card front with chess king and website"></section>
<section class="card-page" aria-label="Back of MaxChess business card"><img src="maxchess-card-back-normal-qr.svg" alt="MaxChess business card back with standard black-and-white QR code"></section>
</body>
</html>
