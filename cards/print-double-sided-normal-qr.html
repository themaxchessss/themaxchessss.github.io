<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}.intro{max-width:900px;margin:0 auto 18px}.intro button{padding:10px 16px;border:1px solid #222;border-radius:8px;background:#fff;font-size:16px;cursor:pointer}.sheet{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:22.75mm 15mm;display:grid;grid-template-columns:87.5mm 87.5mm;grid-template-rows:repeat(5,46.3mm);gap:5mm;align-content:start;justify-content:center;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.card{display:block;width:87.5mm;height:46.3mm;object-fit:fill}.side-label{max-width:900px;margin:18px auto 6px;font-weight:bold}
