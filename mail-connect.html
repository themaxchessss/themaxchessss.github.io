<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect MaxChess to InformationBank Mail</title><style>body{font:16px system-ui;background:#101827;color:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{max-width:520px;background:#1c2940;padding:28px;border-radius:18px}h1{margin-top:0;color:#f2c75c}p{line-height:1.6;color:#cbd5e1}button{padding:12px 18px;border:0;border-radius:10px;background:#e7bd4d;color:#172033;font-weight:800}#status{color:#f5d98a}</style></head><body><main class="card"><h1>MaxChess Mail Connection</h1><p>This securely shares your signed-in MaxChess session with the InformationBank Mail page you opened. Your password is never shared.</p><p id="status">Checking your MaxChess sign-in…</p><button id="retry" hidden>Check again</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{'use strict';
const status=document.getElementById('status'),retry=document.getElementById('retry');
const params=new URLSearchParams(location.search),state=params.get('state')||'',target='https://informashonbank.github.io';
if(!state){status.textContent='Connection request is missing. Return to InformationBank Mail and try again.';return;}
const client=window.supabase.createClient('https://bvukakfhkebpsviehirr.supabase.co','sb_publishable_YTyppUkZGBFHmaNOg2ZSMg_xiFJw2rG',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
async function send(){status.textContent='Checking your MaxChess account…';const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){status.textContent='You are not signed in to MaxChess in this browser. Sign in to MaxChess in another tab, then tap Check again.';retry.hidden=false;return;}if(!window.opener){status.textContent='The InformationBank Mail window is no longer open. Return there and start Connect again.';return;}window.opener.postMessage({type:'MAXCHESS_MAIL_SESSION',state,access_token:data.session.access_token,expires_at:data.session.expires_at},target);status.textContent='Connected! You can return to InformationBank Mail.';setTimeout(()=>window.close(),900);}
retry.addEventListener('click',()=>send().catch(e=>status.textContent=e.message||'Could not check sign-in.'));
send().catch(e=>{status.textContent=e.message||'Could not connect.';retry.hidden=false;});
})();
</script></body></html>
