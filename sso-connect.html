<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in with Lichess — MaxChess</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#101827;color:#f5f7fb;font:16px/1.5 system-ui}.card{width:min(460px,100%);padding:30px;border:1px solid #39465d;border-radius:20px;background:#1c2940}.brand{color:#f2c75c;font-weight:900;letter-spacing:.12em}h1{color:#f2c75c}p{color:#cbd5e1}.button{width:100%;padding:14px;border:0;border-radius:11px;background:#e7bd4d;color:#172033;font-weight:850;font-size:16px;cursor:pointer}#status{min-height:48px;color:#f5d98a;overflow-wrap:anywhere}.small{font-size:13px;color:#9eabc0}</style></head><body><main class="card"><div class="brand">MAXCHESS</div><h1>Sign in with Lichess</h1><p>Use Lichess to sign in to MaxChess. After Lichess confirms your account, this window securely connects your MaxChess session to InformationBank.</p><button class="button" id="start">Continue with Lichess</button><p id="status" role="status" aria-live="polite">Ready to connect.</p><p class="small">Your Lichess password is entered only on lichess.org. InformationBank never receives it.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{'use strict';
const SITE='https://themaxchessss.github.io',REDIRECT=SITE+'/sso-connect.html',PARENT_STATE=new URLSearchParams(location.search).get('ib_state')||'',URL='https://bvukakfhkebpsviehirr.supabase.co',KEY='sb_publishable_YTyppUkZGBFHmaNOg2ZSMg_xiFJw2rG';
const status=document.getElementById('status'),button=document.getElementById('start'),client=window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const random=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return enc(a)};
async function digest(s){return enc(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
async function finish(){const p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state');if(p.has('error')){status.textContent='Lichess sign-in was cancelled. Close this window and try again.';return}if(!code)return;
const saved=sessionStorage.getItem('ib_mc_state'),verifier=sessionStorage.getItem('ib_mc_verifier');if(!saved||state!==saved||!verifier){status.textContent='Security check failed. Start again from InformationBank.';return}
button.disabled=true;status.textContent='Lichess confirmed. Finishing MaxChess sign-in…';
try{const r=await fetch(URL+'/functions/v1/maxchess-lichess-auth',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({code,code_verifier:verifier,redirect_uri:REDIRECT})});const j=await r.json();if(!r.ok)throw Error(j.error||'MaxChess sign-in failed.');
const v=await client.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});if(v.error)throw v.error;if(!v.data.session)throw Error('No MaxChess session was returned.');if(!window.opener)throw Error('Return to InformationBank and start again.');
window.opener.postMessage({type:'MAXCHESS_SSO_SESSION',state:PARENT_STATE,access_token:v.data.session.access_token},'https://informashonbank.github.io');status.textContent='Connected. You can close this window.';sessionStorage.removeItem('ib_mc_state');sessionStorage.removeItem('ib_mc_verifier');history.replaceState({},document.title,REDIRECT);setTimeout(()=>window.close(),900);
}catch(e){status.textContent=e.message||'Could not finish sign-in.';button.disabled=false}}
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Opening Lichess…';try{const verifier=random(48),state=random(24),challenge=await digest(verifier);sessionStorage.setItem('ib_mc_verifier',verifier);sessionStorage.setItem('ib_mc_state',state);const u=new URL('https://lichess.org/oauth');u.search=new URLSearchParams({response_type:'code',client_id:SITE,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:challenge,state,scope:'preference:read'}).toString();location.assign(u.toString())}catch(e){status.textContent='Could not start sign-in. Try again.';button.disabled=false}});
await finish()})();
</script></body></html>
