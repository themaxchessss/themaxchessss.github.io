<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to MaxChess</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{font:16px/1.5 system-ui,-apple-system,sans-serif;background:#101827;color:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.card{width:min(440px,100%);background:#1c2940;padding:28px;border:1px solid #39465d;border-radius:18px;box-shadow:0 18px 55px #0006}
.brand{font-weight:900;letter-spacing:.08em;color:#f2c75c;font-size:14px}
h1{margin:8px 0;color:#f2c75c;font-size:28px}
p{color:#cbd5e1}.field{display:block;margin:16px 0 6px;font-weight:650}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #52617a;background:#101827;color:white;font:inherit}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#e7bd4d;color:#172033;font-weight:850;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#status{min-height:48px;color:#f5d98a;overflow-wrap:anywhere}.links{font-size:14px}.links a{color:#f2c75c}
</style>
</head>
<body><main class="card">
<div class="brand">MAXCHESS</div><h1>Sign in to MaxChess</h1>
<p>Sign in here to securely connect your verified MaxChess email to InformationBank. Your MaxChess password is sent only to MaxChess authentication, never to InformationBank.</p>
<form id="login">
<label class="field" for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label class="field" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Sign in to MaxChess</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p class="links">Need an account? <a href="https://themaxchessss.github.io/" target="_blank" rel="noopener">Create one on MaxChess</a>, then return here and sign in.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
'use strict';
const status=document.getElementById('status'),form=document.getElementById('login'),submit=document.getElementById('submit');
const state=new URLSearchParams(location.search).get('state')||'';
const target='https://informashonbank.github.io';
if(!state){status.textContent='This connection request is missing. Return to InformationBank and try again.';form.hidden=true;return;}
const client=window.supabase.createClient('https://bvukakfhkebpsviehirr.supabase.co','sb_publishable_YTyppUkZGBFHmaNOg2ZSMg_xiFJw2rG',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
async function finish(session){
 if(!session){status.textContent='Sign-in did not return a session. Please try again.';return;}
 const verified=!!(session.user&&session.user.email_confirmed_at);
 if(!verified){status.textContent='Please verify your MaxChess email first. Open the verification email from MaxChess, then sign in here again.';return;}
 if(!window.opener){status.textContent='The InformationBank window is no longer connected. Close this page, return to InformationBank, and tap Continue with MaxChess again.';return;}
 status.textContent='MaxChess sign-in successful. Connecting to InformationBank…';
 window.opener.postMessage({type:'MAXCHESS_SSO_SESSION',state,access_token:session.access_token},target);
 form.hidden=true;
 setTimeout(()=>window.close(),1200);
}
form.addEventListener('submit',async e=>{
 e.preventDefault();submit.disabled=true;status.textContent='Signing in securely with MaxChess…';
 try{
  const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(error)throw error;
  await finish(data.session);
 }catch(err){status.textContent=err.message||'Could not sign in. Check your email and password and try again.';}
 finally{submit.disabled=false;}
});
})();
</script></body></html>
